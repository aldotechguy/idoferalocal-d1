[package]
name = "binding_napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16"
serde_json = "1.0"
money_ledger = { path = "../money_ledger" }
relational_core = { path = "../relational_core" }
mall_engine = { path = "../mall_engine" }

[build-dependencies]
napi-build = "2.1"

[dev-dependencies]
serde_json = "1.0"
