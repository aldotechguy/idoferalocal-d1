  <body>
    <div id="root"></div>
    <!--
      Production may still be controlled by a service worker installed by an
      earlier release (our own bootstrap only unregisters in dev). Purge any
      cache that is not the one the current worker owns, nudge registrations to
      update, then hand off to the app bootstrap. The cache name must track
      CACHE_NAME in public/sw.js, and the handoff must stay on bootstrap.ts so
      the dev worker cleanup and its contract test keep running.
    -->
    <script type="module">
      (async () => {
        const CURRENT_CACHE = 'idofera-pos-v5';
        if ('caches' in window) {
          try {
            const keys = await caches.keys();
            for (const key of keys) {
              if (key.startsWith('idofera-pos-') && key !== CURRENT_CACHE) {
                await caches.delete(key);
              }
            }
          } catch {}
        }
        if ('serviceWorker' in navigator) {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) {
              reg.update().catch(() => {});
            }
          } catch {}
        }
        await import('/src/bootstrap.ts');
      })();
    </script>
  </body>
