name: Native hybrid checks
on:
  push:
  pull_request:

jobs:
  rust-and-addon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - run: npm run test:rust
      - run: npm run build:native
      - run: npm run test:native
      - run: npm run test:native-parity
      - run: npm run test:native-rollout
        env:
          IDOFERA_NATIVE_ENABLED: "true"
