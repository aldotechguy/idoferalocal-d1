name = "idofera-packaging"
main = "sites-worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[site]
bucket = "./dist"

[[r2_buckets]]
binding = "MALL_IMAGES"
bucket_name = "idofera-mall-images"

[[d1_databases]]
binding = "DB"
database_name = "idofera-d1"
database_id = "3e95a550-a091-490b-819d-f0acb7ea8dd8"

# Unified Mall branch preview env -> new proper relational D1 `idofera`.
# Usage: `npx wrangler dev --env mall` / `npx wrangler deploy --env mall`
# NOTE: replace database_id with the real id after `npx wrangler d1 create idofera`.
[env.mall]
name = "idofera-mall-preview"

[env.mall.triggers]
crons = ["*/5 * * * *"]

[[env.mall.d1_databases]]
binding = "DB"
database_name = "idofera"
database_id = "3a3eb157-5aa5-419a-a8ce-2eade2afc436"

# #14 — durable product images. Create the preview bucket before deploying:
#   npx wrangler r2 bucket create idofera-mall-images-preview
[[env.mall.r2_buckets]]
binding = "MALL_IMAGES"
bucket_name = "idofera-mall-images-preview"

