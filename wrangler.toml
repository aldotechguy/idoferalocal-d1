name = "idofera-packaging"
main = "sites-worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Display-only: the health endpoint reports which bound D1 database answered.
[vars]
D1_DATABASE_ID = "3e95a550-a091-490b-819d-f0acb7ea8dd8"
# Kill-switch for honoring the product-level POS promotional price on the Mall.
# Default OFF: review what would change via posPromoPriceKobo in Mall Listings,
# then set to "true" and redeploy.
MALL_HONOR_POS_PROMOS = "false"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "MALL_IMAGES"
bucket_name = "idofera-mall-images"

[[d1_databases]]
binding = "DB"
database_name = "idofera-d1"
database_id = "3e95a550-a091-490b-819d-f0acb7ea8dd8"

# Live Mall target: shortened public name, backed by relational D1 `idofera`.
# Usage: `npx wrangler dev --env mall` / `npx wrangler deploy --env mall`
[env.mall]
name = "idomall"

[env.mall.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[env.mall.triggers]
crons = ["*/5 * * * *"]

[[env.mall.d1_databases]]
binding = "DB"
database_name = "idofera"
database_id = "3a3eb157-5aa5-419a-a8ce-2eade2afc436"

# Live product-image bucket. This environment is no longer disposable preview.
[[env.mall.r2_buckets]]
binding = "MALL_IMAGES"
bucket_name = "idomall"

[env.mall.vars]
# Display-only: the health endpoint reports which bound D1 database answered.
D1_DATABASE_ID = "3a3eb157-5aa5-419a-a8ce-2eade2afc436"
# Kill-switch for honoring the product-level POS promotional price on the Mall.
# Default OFF: review what would change via posPromoPriceKobo in Mall Listings
# (staff dashboard), then set to "true" and redeploy to enable catalog-wide.
MALL_HONOR_POS_PROMOS = "false"
# Non-sensitive Mall config. Update MALL_PICKUP_ADDRESS and MALL_PICKUP_HOURS
# to your real pickup location and hours before accepting orders.
MALL_CHECKOUT_ENABLED = "true"
MALL_PICKUP_ADDRESS = "16 Atakpo Street, Uyo, Akwa Ibom"
MALL_PICKUP_HOURS = "10AM - 6PM"
  MALL_BANK_NAME = "MONIEPOINT"
  MALL_BANK_ACCOUNT_NAME = "IDOFERA ENTERPRISE"
  MALL_BANK_ACCOUNT_NUMBER = "8063766861"
  MALL_WEBHOOK_URL = "https://idomall.olz.workers.dev/api/mall-webhook"
  # Sender for order emails. Must be an address on a domain verified in Resend.
  # `idofera.de5.net` (apex) is verified, so this delivers to any recipient;
  # the sandbox sender `onboarding@resend.dev` would only reach the account owner.
  MALL_EMAIL_FROM = "Idofera <orders@idofera.de5.net>"
  # MALL_WEBHOOK_SECRET, MALL_NOTIFY_EMAIL and RESEND_API_KEY are Wrangler
  # secrets (never committed): `npx wrangler secret put --env mall <NAME>`.
  # The scheduled drain signs each outbox POST with MALL_WEBHOOK_SECRET and
  # posts it to MALL_WEBHOOK_URL above; the receiver verifies that signature and
  # emails the operator via Resend.

# Disposable preview target for the launch contract checks (maximum intended cart
# size and existing-schema rollout). Isolated D1 + R2 and placeholder business
# config, so preview runs never touch live orders, stock, customers or bank
# details. No cron trigger on purpose: the preview must not open a second
# notification pipeline. Readiness therefore reports scheduler:false here.
# Usage: `npx wrangler deploy --env preview`
[env.preview]
name = "idomall-preview"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# The top-level [triggers] cron is inherited by named environments, so it must be
# explicitly emptied here: the disposable preview must not open a second
# notification pipeline (or email the operator for contract-check orders).
[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "idofera-preview"
database_id = "647becf9-e665-4a85-9fa5-dbb5dedbcefa"

[[env.preview.r2_buckets]]
binding = "MALL_IMAGES"
bucket_name = "idomall-preview"

[env.preview.vars]
D1_DATABASE_ID = "647becf9-e665-4a85-9fa5-dbb5dedbcefa"
MALL_HONOR_POS_PROMOS = "false"
MALL_CHECKOUT_ENABLED = "true"
MALL_PICKUP_ADDRESS = "Preview pickup (disposable)"
MALL_PICKUP_HOURS = "9AM - 5PM"
MALL_BANK_NAME = "PREVIEW BANK"
MALL_BANK_ACCOUNT_NAME = "IDOFERA PREVIEW"
MALL_BANK_ACCOUNT_NUMBER = "0000000000"
MALL_EMAIL_FROM = "Idofera Preview <orders@idofera.de5.net>"
MALL_WEBHOOK_URL = "https://idomall-preview.olz.workers.dev/api/mall-webhook"
# MALL_WEBHOOK_SECRET, MALL_NOTIFY_EMAIL and RESEND_API_KEY are set the same way
# as the mall environment: `npx wrangler secret put --env preview <NAME>`.

